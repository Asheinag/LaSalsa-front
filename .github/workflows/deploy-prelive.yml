name: Deploy Prelive (frontend)

on:
  push:
    branches: [ "test" ]
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "pubspec.yaml"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/deploy-prelive-frontend.yml"
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_REPO: ghcr.io/kabachok-club/lasalsa-front
      SHA_TAG: prelive-${{ github.sha }}
      LATEST_TAG: prelive-latest
      APP_HOST: app.prelive.lasalsa.kabachok.club

      # Dart-defines (храни как Repository Variables или Secrets → vars.*)
      API_BASE_URL: ${{ vars.API_BASE_URL_PRELIVE || 'https://api.prelive.lasalsa.kabachok.club' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY_PRELIVE }}
      FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_AUTH_DOMAIN_PRELIVE || 'app.prelive.lasalsa.kabachok.club' }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID_PRELIVE || 'lasalsa-prelive' }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID_PRELIVE }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID_PRELIVE }}
      FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STORAGE_BUCKET_PRELIVE }}
      FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_MEASUREMENT_ID_PRELIVE || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (Flutter web → Nginx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REPO }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE_REPO }}:${{ env.LATEST_TAG }}
          build-args: |
            API_BASE_URL=${{ env.API_BASE_URL }}
            FIREBASE_API_KEY=${{ env.FIREBASE_API_KEY }}
            FIREBASE_AUTH_DOMAIN=${{ env.FIREBASE_AUTH_DOMAIN }}
            FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
            FIREBASE_APP_ID=${{ env.FIREBASE_APP_ID }}
            FIREBASE_MESSAGING_SENDER_ID=${{ env.FIREBASE_MESSAGING_SENDER_ID }}
            FIREBASE_STORAGE_BUCKET=${{ env.FIREBASE_STORAGE_BUCKET }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_PRELIVE }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: APP_HOST
          script_stop: true
          script: |
            set -e
            cd /opt/prelive
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ${{ env.IMAGE_REPO }}:${{ env.SHA_TAG }}
            docker tag  ${{ env.IMAGE_REPO }}:${{ env.SHA_TAG }} ${{ env.IMAGE_REPO }}:${{ env.LATEST_TAG }}
            docker compose up -d app
            for i in {1..15}; do
              if curl -fsSL --max-time 5 \
                --resolve ${APP_HOST}:443:127.0.0.1 \
                https://${APP_HOST}/ -k >/dev/null; then
                echo "frontend OK"; break
              fi
              echo "waiting frontend ($i/15) ..."
              sleep 2
            done
name: Flutter CI
on:
  push:
    branches: [main, test, development]
  pull_request:
    branches: [main, test, development]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    container:
      image: dart:stable

    steps:
      # Вместо uses: actions/checkout@v4 делаем ручной клон
      - name: Checkout code
        run: |
          # Используем IP вместо домена, чтобы избежать проблем с DNS
          # Порт 3000 — стандарт для Gitea HTTP, если у тебя другой (например 80) — замени.
          git clone http://${{ github.token }}@45.131.40.25:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $GITHUB_WORKSPACE/flutter
          # Добавляем в PATH для текущего шага и всех последующих
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH

      - name: Flutter Doctor & Get Deps
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter doctor
          flutter pub get

      - name: Static Analysis
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter analyze

      - name: Run Tests
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter test
name: Flutter CI
on:
  pull_request:
    branches:
      - main
      - development
      - test


jobs:
  analyze_and_test:
    runs-on: ubuntu-latest # Или имя твоего тега раннера, если ты его менял
    container:
      image: mobiledevops/flutter-sdk-image # Официально поддерживаемый образ с Flutter
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test
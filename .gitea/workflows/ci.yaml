name: Flutter CI
on:
  push:
    branches: [main, test, development]
  pull_request:
    branches: [main, test, development]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    container:
      # Этот образ уже содержит Flutter, не надо его клонировать!
      image: mobiledevops/flutter-sdk-image:3.16.3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Static Analysis
        run: flutter analyze

      - name: Run Tests
        run: flutter test

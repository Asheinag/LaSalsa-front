name: Flutter CI
on:
  push:
    branches: [main, test, development]
  pull_request:
    branches: [main, test, development]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    container:
      image: dart:stable # Официальный образ Dart, Node.js там обычно есть для JS-интерпа

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter
        run: |
          git clone https://github.com/flutter/flutter.git -b stable $GITHUB_WORKSPACE/flutter
          echo "$GITHUB_WORKSPACE/flutter/bin" >> $GITHUB_PATH

      - name: Get dependencies
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter doctor # Проверка здоровья
          flutter pub get

      - name: Static Analysis
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter analyze

      - name: Run Tests
        run: |
          export PATH="$PATH:$GITHUB_WORKSPACE/flutter/bin"
          flutter test
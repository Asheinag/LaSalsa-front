name: Flutter CI
on:
  push:
    branches: [main, test, development]
  pull_request:
    branches: [main, test, development]

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest
    container:
      # Этот образ уже содержит Flutter, не надо его клонировать!
      image: ghcr.io/shubham-gupta-16/flutter-sdk:stable 

    steps:
      - name: Checkout
        run: |
          git clone http://${{ github.token }}@45.131.40.25:3000/${{ github.repository }}.git .
          git checkout ${{ github.sha }}

      - name: Get Deps
        run: flutter pub get --offline || flutter pub get # Сначала ищем в кэше

      - name: Fast Analyze
        run: flutter analyze lib/ # Анализируем только твой код, а не тесты и пакеты

      - name: Run Tests
        run: flutter test
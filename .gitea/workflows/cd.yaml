name: Flutter CD (Local Runner)
on:
  push:
    tags:
      - 'v*' # Сработает на v1.0.0, v2.1 и т.д.

jobs:
  deploy:
    runs-on: local-flutter # Твой локальный раннер
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: flutter pub get

      - name: Build Web Release
        run: |
          flutter build web --release `
          --dart-define=API_BASE_URL=${{ secrets.API_BASE_URL }} `
          --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} `
          --dart-define=FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }} `
          --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }} `
          --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} `
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ secrets.FIREBASE_MESSAGING_SENDER_ID }} `
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ secrets.FIREBASE_STORAGE_BUCKET }}

      - name: Archive and Upload to Server
        shell: powershell
        run: |
          # Упаковываем только содержимое папки build/web
          tar -czf frontend.tar.gz -C build/web .
          # Копируем на сервер в /tmp
          scp -P ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no frontend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.LASALSA_HOST }}:/tmp/

      - name: Deploy on Remote Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LASALSA_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            # Очищаем старую статику и распаковываем новую
            mkdir -p ~/lasalsa-app/frontend/static
            rm -rf ~/lasalsa-app/frontend/static/*
            tar -xzf /tmp/frontend.tar.gz -C ~/lasalsa-app/frontend/static
            rm /tmp/frontend.tar.gz
            # Перезапускаем Nginx, чтобы он подхватил файлы (опционально, но надежнее)
            cd ~/lasalsa-app && docker compose -f docker-compose.prod.yml restart lasalsa-nginx
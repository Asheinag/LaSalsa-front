server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;

  # Сжатие
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 1) index.html — всегда без кэша
  location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # 2) Сервис-воркер и манифесты — тоже без кэша
  location = /flutter_service_worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  location = /manifest.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # (опционально) файлы версии/иконки без кэша
  location = /version.json {
    try_files $uri =404;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
  }

  # 3) Статические ассеты — можно кэшировать надолго
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # 4) SPA fallback (без заголовков кэша — index.html уже прикрыт правилом выше)
  location / {
    try_files $uri /index.html;
  }
}
